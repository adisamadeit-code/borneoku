<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - BorneoKu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Login Lock Area -->
    <div id="login-screen" class="fixed inset-0 bg-emerald-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full text-center">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-1">Admin BorneoKu</h2>
            <p class="text-xs text-gray-500 mb-4">Masukkan kata sandi untuk mengelola marketplace.</p>
            <input type="password" id="admin-pass" placeholder="Sandi Admin" class="w-full text-sm p-3 border rounded-xl mb-3 text-center focus:ring-2 focus:ring-emerald-500 outline-none">
            <button onclick="checkAdminPassword()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                Masuk Dashboard
            </button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-content" class="hidden">
        <!-- Header -->
        <header class="bg-emerald-800 text-white py-4 px-6 shadow-md flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-gauge-high text-xl"></i>
                <h1 class="font-bold text-lg">BorneoKu Admin Center</h1>
            </div>
            <a href="index.html" class="bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-semibold">
                <i class="fa-solid fa-store mr-1"></i> Lihat Toko
            </a>
        </header>

        <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
            <!-- Form Tambah Produk Baru -->
            <div class="bg-white rounded-xl p-5 shadow-sm border">
                <h2 class="text-lg font-bold text-emerald-800 mb-3 flex items-center">
                    <i class="fa-solid fa-plus-circle mr-2"></i> Tambah Produk Baru
                </h2>
                <form id="add-product-form" onsubmit="addNewProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Pilih Toko / UMKM Penjual</label>
                        <select id="prod_seller_id" required class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="">-- Pilih UMKM Penjual --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Produk</label>
                        <input type="text" id="prod_name" required placeholder="Contoh: Kain Batik Souvenir" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Harga (Rp)</label>
                        <input type="number" id="prod_price" required placeholder="75000" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori</label>
                        <input type="text" id="prod_category" placeholder="Kerajinan / Busana / Kuliner" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Link Gambar / Foto Produk (URL)</label>
                        <input type="url" id="prod_image" required placeholder="https://..." class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" id="btn-save-product" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 px-6 rounded-lg text-sm transition">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan & Publikasikan Produk
                        </button>
                    </div>
                </form>
            </div>

            <!-- Daftar Mitra UMKM Terdaftar -->
            <div class="bg-white rounded-xl p-5 shadow-sm border">
                <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center">
                    <i class="fa-solid fa-users-gear mr-2 text-emerald-700"></i> Daftar Mitra UMKM Pendaftar
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs md:text-sm">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 border-b">
                                <th class="p-3">Nama Toko</th>
                                <th class="p-3">Pemilik</th>
                                <th class="p-3">Kota</th>
                                <th class="p-3">WhatsApp</th>
                                <th class="p-3">Kategori</th>
                            </tr>
                        </thead>
                        <tbody id="sellers-table-body">
                            <tr>
                                <td colspan="5" class="p-4 text-center text-gray-400">Memuat data UMKM...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://syqhyqffvxpxzhyxptwq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5cWh5cWZmdnhweHpoeXhwdHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMTcwNTUsImV4cCI6MjA1Njc5MzA1NX0.S_1Uf19J3oM4r2tQ1o7B80u2S4xR2jN8P8Y8Z8Z8Z8Z';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function checkAdminPassword() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                loadSellersData();
            } else {
                alert('Sandi salah!');
            }
        }

        async function loadSellersData() {
            const { data: sellers, error } = await supabase.from('sellers').select('*');
            const tbody = document.getElementById('sellers-table-body');
            const selectSeller = document.getElementById('prod_seller_id');

            if (error || !sellers || sellers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada UMKM yang mendaftar.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            selectSeller.innerHTML = '<option value="">-- Pilih UMKM Penjual --</option>';

            sellers.forEach(s => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-semibold text-emerald-800">${s.store_name}</td>
                        <td class="p-3">${s.owner_name}</td>
                        <td class="p-3">${s.city}</td>
                        <td class="p-3 text-emerald-700 font-semibold">${s.whatsapp}</td>
                        <td class="p-3"><span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs">${s.category || '-'}</span></td>
                    </tr>
                `;
                selectSeller.innerHTML += `<option value="${s.id}">${s.store_name} (${s.owner_name})</option>`;
            });
        }

        async function addNewProduct(event) {
            event.preventDefault();
            const seller_id = document.getElementById('prod_seller_id').value;
            const name = document.getElementById('prod_name').value;
            const price = parseFloat(document.getElementById('prod_price').value);
            const category = document.getElementById('prod_category').value;
            const image_url = document.getElementById('prod_image').value;

            const { data, error } = await supabase.from('products').insert([
                { name, price, category, image_url, seller_id }
            ]);

            if (error) {
                alert('Gagal menambah produk: ' + error.message);
            } else {
                alert('Produk berhasil dipublikasikan!');
                document.getElementById('add-product-form').reset();
            }
        }
    </script>
</body>
</html>
