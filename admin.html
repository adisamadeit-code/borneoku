<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - BorneoKu</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .bg-borneo-dark { background-color: #064e3b; }
    .text-gold { color: #d4af37; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <!-- HEADER ADMIN -->
  <header class="bg-borneo-dark text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-user-shield text-amber-400 text-xl"></i>
        <h1 class="font-extrabold text-lg">Dashboard Admin <span class="text-gold">BorneoKu</span></h1>
      </div>
      <a href="index.html" class="bg-emerald-800 hover:bg-emerald-950 text-xs px-3 py-1.5 rounded-lg border border-emerald-600 transition flex items-center gap-1.5">
        <i class="fa-solid fa-house"></i>
        <span>Ke Utama</span>
      </a>
    </div>
  </header>

  <!-- FORM LOGIN ADMIN -->
  <div id="login-section" class="max-w-md mx-auto my-12 p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
    <div class="text-center mb-6">
      <div class="bg-emerald-100 text-emerald-800 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-bold">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-gray-900">Login Administrator</h2>
      <p class="text-xs text-gray-500 mt-1">Masukkan kata sandi untuk mengelola produk</p>
    </div>
    
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Kata Sandi</label>
        <input type="password" id="admin-password" placeholder="Masukkan kata sandi..." required 
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
      </div>
      <p id="login-error" class="text-xs text-red-500 hidden font-semibold">Kata sandi salah, silakan coba lagi.</p>
      <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
        Masuk Dashboard &rarr;
      </button>
    </form>
  </div>

  <!-- DASHBOARD PANEL (TERSEMBUNYI SEBELUM LOGIN) -->
  <div id="dashboard-section" class="max-w-4xl mx-auto my-8 p-4 md:p-6 space-y-6 hidden">
    
    <!-- DRAF/FORM TAMBAH PRODUK -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 space-y-4">
      <h3 class="text-lg font-bold text-gray-900 border-b pb-3 flex items-center gap-2">
        <i class="fa-solid fa-square-plus text-emerald-800"></i> Tambah Produk UMKM Baru
      </h3>

      <form onsubmit="handleAddProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Nama Produk</label>
          <input type="text" id="prod-name" placeholder="Contoh: Tas Anjat Kalimantan" required
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Harga (Rp)</label>
          <input type="number" id="prod-price" placeholder="Contoh: 150000" required
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Kategori Produk</label>
          <select id="prod-category" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
            <option value="Kerajinan">Kerajinan</option>
            <option value="Tekstil & Pakaian">Tekstil & Pakaian</option>
            <option value="Makanan & Minuman">Makanan & Minuman</option>
            <option value="Aksesoris">Aksesoris</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">No. WhatsApp Penjual (Dengan 62)</label>
          <input type="text" id="prod-wa" placeholder="Contoh: 6281241170658" required
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-gray-700 mb-1">URL Gambar Produk</label>
          <input type="url" id="prod-img" placeholder="https://..." 
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
          <p class="text-[10px] text-gray-400 mt-1">Bisa dikosongkan untuk memakai gambar standar.</p>
        </div>

        <div class="md:col-span-2 pt-2">
          <button type="submit" id="btn-save" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3 rounded-xl text-xs transition shadow-md flex justify-center items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Simpan Produk ke Database</span>
          </button>
        </div>
      </form>
    </div>

    <!-- DAFTAR PRODUK DALAM DATABASE -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 space-y-4">
      <h3 class="text-lg font-bold text-gray-900 border-b pb-3 flex items-center gap-2">
        <i class="fa-solid fa-boxes-packing text-emerald-800"></i> Kelola Daftar Produk
      </h3>
      
      <div id="admin-product-list" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-6">Memuat data produk...</p>
      </div>
    </div>

  </div>

  <!-- SUPABASE SCRIPT & LOGIKA ADMIN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://iegqvegvoqjqjjyucpss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7o0SP7VYOFhYJ0qyDrPtzw_2VvkuiMy';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Kata sandi default admin (dapat disesuaikan)
    const PASS_ADMIN = "admin123";

    function handleLogin(e) {
      e.preventDefault();
      const inputPass = document.getElementById('admin-password').value;
      if (inputPass === PASS_ADMIN) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        loadAdminProducts();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    async function loadAdminProducts() {
      const container = document.getElementById('admin-product-list');
      try {
        const { data, error } = await supabaseClient.from('products').select('*');
        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">Belum ada produk di database.</p>`;
          return;
        }

        container.innerHTML = data.map(item => {
          const nama = item.nama_produk || item.nama || item.name || 'Produk';
          const harga = item.harga || item.price || 0;
          return `
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
              <div>
                <p class="font-bold text-xs text-gray-800">${nama}</p>
                <p class="text-[11px] text-emerald-800 font-semibold">Rp ${Number(harga).toLocaleString('id-ID')}</p>
              </div>
              <button onclick="deleteProduct('${item.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold px-3 py-1 bg-red-50 rounded-lg border border-red-200">
                <i class="fa-solid fa-trash-can"></i> Hapus
              </button>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-center text-xs text-red-500 py-4">Gagal memuat produk.</p>`;
      }
    }

    async function handleAddProduct(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('btn-save');
      saveBtn.disabled = true;
      saveBtn.innerText = "Menyimpan...";

      const name = document.getElementById('prod-name').value;
      const price = document.getElementById('prod-price').value;
      const category = document.getElementById('prod-category').value;
      const wa = document.getElementById('prod-wa').value;
      const img = document.getElementById('prod-img').value;

      try {
        const { error } = await supabaseClient.from('products').insert([
          { 
            nama_produk: name, 
            harga: price, 
            kategori: category, 
            whatsapp: wa, 
            image_url: img || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80' 
          }
        ]);

        if (error) throw error;

        alert('Produk berhasil ditambahkan!');
        e.target.reset();
        loadAdminProducts();
      } catch (err) {
        alert('Gagal menambah produk: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Simpan Produk ke Database</span>`;
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus produk ini?')) return;
      try {
        const { error } = await supabaseClient.from('products').delete().eq('id', id);
        if (error) throw error;
        alert('Produk berhasil dihapus!');
        loadAdminProducts();
      } catch (err) {
        alert('Gagal menghapus produk: ' + err.message);
      }
    }
  </script>
</body>
</html>
