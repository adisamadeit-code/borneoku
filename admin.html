<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Borneoku</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .bg-borneo-dark { background-color: #064e3b; }
    .text-gold { color: #d4af37; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <header class="bg-borneo-dark text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-user-shield text-amber-400 text-xl"></i>
        <h1 class="font-extrabold text-lg">Dashboard Admin <span class="text-gold">Borneoku</span></h1>
      </div>
      <a href="index.html" class="bg-emerald-800 hover:bg-emerald-950 text-xs px-3 py-1.5 rounded-lg border border-emerald-600 transition flex items-center gap-1.5">
        <i class="fa-solid fa-house"></i>
        <span>Ke Utama</span>
      </a>
    </div>
  </header>

  <!-- FORM LOGIN -->
  <div id="login-section" class="max-w-md mx-auto my-12 p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
    <div class="text-center mb-6">
      <div class="bg-emerald-100 text-emerald-800 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-bold">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-gray-900">Login Administrator</h2>
      <p class="text-xs text-gray-500 mt-1">Masukkan kata sandi untuk mengontrol toko</p>
    </div>
    
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Kata Sandi</label>
        <input type="password" id="admin-password" placeholder="Masukkan kata sandi..." required 
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
      </div>
      <p id="login-error" class="text-xs text-red-500 hidden font-semibold">Kata sandi salah, silakan coba lagi.</p>
      <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
        Masuk Dashboard &rarr;
      </button>
    </form>
  </div>

  <!-- DASHBOARD PANEL -->
  <div id="dashboard-section" class="max-w-4xl mx-auto my-8 p-4 md:p-6 space-y-6 hidden">
    
    <!-- FORM TAMBAH PRODUK -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 space-y-4">
      <h3 class="text-lg font-bold text-gray-900 border-b pb-3 flex items-center gap-2">
        <i class="fa-solid fa-square-plus text-emerald-800"></i> Tambah Produk & Kelola Etalase
      </h3>

      <form onsubmit="handleSaveProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="prod-img-url" value="https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80">

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Nama Produk</label>
          <input type="text" id="prod-name" placeholder="Contoh: Tas Anjat Kalimantan" required
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Harga (Rp)</label>
          <input type="number" id="prod-price" placeholder="Contoh: 150000" required
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Kategori Produk</label>
          <select id="prod-category" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
            <option value="Kerajinan">Kerajinan Tangan</option>
            <option value="Tekstil & Pakaian">Tekstil & Pakaian</option>
            <option value="Makanan & Minuman">Makanan & Minuman Khas</option>
            <option value="Aksesoris">Aksesoris & Perhiasan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">No. WhatsApp Penjual</label>
          <input type="text" id="prod-wa" placeholder="Contoh: 6281241170648" required
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-emerald-600">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-gray-700 mb-1">Unggah Foto Produk dari Galeri HP</label>
          <input type="file" id="prod-file" accept="image/*" onchange="previewImage(event)"
                 class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs bg-gray-50 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
        </div>

        <div class="md:col-span-2 pt-2">
          <button type="submit" id="btn-save" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3 rounded-xl text-xs transition shadow-md flex justify-center items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Produk ke Database & Etalase
          </button>
        </div>
      </form>
    </div>

    <!-- KURASI & VERIFIKASI PRODUK -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 space-y-4">
      <h3 class="text-lg font-bold text-gray-900 border-b pb-3 flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-emerald-800"></i> Kurir & Verifikasi Produk UMKM (Halal/Layak Jual)
      </h3>
      <div id="admin-product-list" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-6">Memuat data produk...</p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://iegqvegvoqjqjjyucpss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7o0SP7VYOFhYJ0qyDrPtzw_2VvkuiMy';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const PASS_ADMIN = "admin123";

    let cachedProducts = [];

    function handleLogin(e) {
      e.preventDefault();
      if (document.getElementById('admin-password').value === PASS_ADMIN) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        loadAdminProducts();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('prod-img-url').value = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function loadAdminProducts() {
      const container = document.getElementById('admin-product-list');
      try {
        const { data, error } = await supabaseClient.from('products').select('*');
        if (error) throw error;
        cachedProducts = data || [];

        if (cachedProducts.length === 0) {
          container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">Belum ada produk.</p>`;
          return;
        }

        container.innerHTML = cachedProducts.map(item => `
          <div class="flex items-center justify-between p-3.5 bg-gray-50 rounded-xl border border-gray-200 gap-3">
            <div>
              <p class="font-bold text-xs text-gray-900">${item.title || 'Produk'}</p>
              <p class="text-[11px] text-emerald-900 font-semibold">Rp ${Number(item.price || 0).toLocaleString('id-ID')} | WA: ${item.whatsapp || '-'}</p>
            </div>
            <button onclick="deleteProduct('${item.id}')" class="text-red-500 hover:text-red-700 text-[11px] font-bold px-3 py-1.5 bg-red-50 rounded-lg border border-red-200">
              <i class="fa-solid fa-trash-can"></i> Hapus
            </button>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-center text-xs text-red-500 py-4">Gagal memuat produk.</p>`;
      }
    }

    async function handleSaveProduct(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('btn-save');
      
      const payload = {
        title: document.getElementById('prod-name').value,
        price: Number(document.getElementById('prod-price').value),
        category: document.getElementById('prod-category').value,
        whatsapp: document.getElementById('prod-wa').value,
        image_url: document.getElementById('prod-img-url').value,
        status: 'disetujui'
      };

      try {
        const { error } = await supabaseClient.from('products').insert([payload]);
        if (error) throw error;
        alert('Produk berhasil disimpan! Menuju ke halaman utama...');
        window.location.href = 'index.html'; // Langsung beralih ke halaman utama setelah disimpan
      } catch (err) {
        alert('Gagal menyimpan produk: ' + err.message);
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Hapus produk ini?')) return;
      try {
        const { error } = await supabaseClient.from('products').delete().eq('id', id);
        if (error) throw error;
        alert('Produk berhasil dihapus!');
        loadAdminProducts();
      } catch (err) {
        alert('Gagal menghapus: ' + err.message);
      }
    }
  </script>
</body>
</html>
