<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Layanan Mitra Borneoku</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-borneo-dark { background-color: #064e3b; }
    body { background-color: #f8fafc; padding-bottom: 90px; }
  </style>
</head>
<body class="font-sans text-gray-800">

  <!-- HEADER ADMIN -->
  <header class="bg-borneo-dark text-white p-3 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-store text-amber-300 text-base"></i>
        <h1 class="font-bold text-xs sm:text-sm">Panel Admin <span class="text-amber-300">Borneoku</span></h1>
      </div>
      <a href="index.html" class="bg-emerald-800 hover:bg-emerald-900 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold border border-emerald-600 shadow-sm flex items-center gap-1.5">
        <i class="fa-solid fa-house text-xs"></i> Ke Beranda
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <div>
          <h2 class="font-extrabold text-gray-900 text-sm flex items-center gap-2">
            <i class="fa-solid fa-lock text-emerald-800"></i> Verifikasi Produk Masuk
          </h2>
          <p class="text-xs text-gray-500 mt-0.5">Klik tombol Setuju untuk menayangkan produk di Beranda:</p>
        </div>
        <button onclick="loadAdminProducts()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold">
          <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
        </button>
      </div>

      <div id="admin-product-list" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-6">Memuat daftar produk...</p>
      </div>
    </div>
  </main>

  <!-- NAVBAR BAWAH -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 px-3 flex justify-around items-center z-50 shadow-lg">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-800">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px] mt-1">Beranda</span>
    </a>
    <a href="admin.html" class="flex flex-col items-center text-emerald-800 font-bold">
      <i class="fa-solid fa-lock text-base"></i>
      <span class="text-[10px] mt-1">Admin</span>
    </a>
  </nav>

  <!-- SCRIPT SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://iegqvegvoqjqjjyucpss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7o0SP7VYOFhYJ0qyDrPtzw_2VvkuiMy';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAdminProducts() {
      const container = document.getElementById('admin-product-list');
      container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat...</p>`;
      
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">Tidak ada produk di database.</p>`;
          return;
        }

        container.innerHTML = data.map(item => {
          const title = item.title || item.name || 'Produk Tanpa Nama';
          const price = item.price ? Number(item.price).toLocaleString('id-ID') : '0';
          const wa = item.phone_number || item.whatsapp || '-';
          const address = item.address || '-';
          const status = item.status || 'pending';
          const img = item.image_url || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=100&q=80';

          const isApproved = (status === 'approved' || status === 'disetujui');
          const statusBadge = isApproved 
            ? `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded text-[10px] font-bold">Approved</span>`
            : `<span class="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded text-[10px] font-bold">Pending</span>`;

          return `
            <div class="p-3.5 border border-gray-200 rounded-xl flex items-center justify-between gap-3 bg-white shadow-sm">
              <div class="flex items-center gap-3 min-w-0">
                <img src="${img}" alt="${title}" class="w-14 h-14 rounded-lg object-cover bg-gray-100 shrink-0">
                <div class="min-w-0 space-y-0.5">
                  <h4 class="font-bold text-xs sm:text-sm text-gray-900 truncate">${title}</h4>
                  <p class="text-xs text-gray-600 font-medium">Rp ${price} | WA: ${wa}</p>
                  <p class="text-[11px] text-gray-400 truncate">Alamat: ${address}</p>
                  <div class="pt-1">${statusBadge}</div>
                </div>
              </div>
              <div class="flex gap-2 shrink-0">
                ${isApproved 
                  ? `<button onclick="updateStatus('${item.id}', 'pending')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm transition">Batal</button>` 
                  : `<button onclick="updateStatus('${item.id}', 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm transition">Setuju</button>`
                }
                <button onclick="removeProduct('${item.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm transition">Hapus</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-center text-xs text-red-500 py-6">Gagal memuat: ${err.message}</p>`;
      }
    }

    window.updateStatus = async function(id, newStatus) {
      try {
        const { error } = await supabaseClient
          .from('products')
          .update({ status: newStatus })
          .eq('id', id);

        if (error) throw error;
        loadAdminProducts();
      } catch (err) {
        alert('Gagal mengubah status: ' + err.message);
      }
    };

    window.removeProduct = async function(id) {
      if (!confirm('Yakin ingin menghapus produk ini?')) return;
      try {
        const { error } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);

        if (error) throw error;
        loadAdminProducts();
      } catch (err) {
        alert('Gagal menghapus: ' + err.message);
      }
    };

    document.addEventListener('DOMContentLoaded', loadAdminProducts);
  </script>
</body>
  </html>
