<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borneoku - Karya Nusantara, Pasar Dunia</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#064e3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .bg-borneo-dark { background-color: #064e3b; }
    .text-gold { color: #d4af37; }
    body { background-color: #f8fafc; padding-bottom: 90px; }
  </style>
</head>
<body class="font-sans text-gray-800">

  <!-- HEADER UTAMA -->
  <header class="bg-borneo-dark text-white p-3 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <!-- LOGO AMAN & OTOMATIS MENDETEKSI FILE DI GITHUB -->
        <div class="w-10 h-10 rounded-full bg-amber-400 p-0.5 shadow-md shrink-0 flex items-center justify-center overflow-hidden border border-amber-300">
          <img src="1000386730.png" alt="Logo Borneoku" class="w-full h-full object-cover rounded-full" onerror="this.onerror=null; this.src='1000386784.png';">
        </div>
        <div>
          <h1 class="font-extrabold text-sm tracking-wide leading-tight text-white">BORNEOKU</h1>
          <p class="text-[8px] text-amber-300 font-bold tracking-wider">KARYA NUSANTARA, PASAR DUNIA</p>
        </div>
      </div>
      
      <!-- KERANJANG & ADMIN -->
      <div class="flex items-center gap-2">
        <button onclick="viewCart()" class="bg-emerald-800 hover:bg-emerald-900 text-xs px-2.5 py-1.5 rounded-xl border border-emerald-600 transition flex items-center gap-1.5 font-semibold shadow-sm text-white">
          <i class="fa-solid fa-cart-shopping text-amber-300 text-xs"></i>
          <span class="text-[11px]"><span id="cart-count" class="bg-amber-400 text-emerald-950 px-1.5 py-0.2 rounded-full text-[9px] font-bold">0</span></span>
        </button>
        <a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1">
          <i class="fa-solid fa-lock text-[10px]"></i> Admin
        </a>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA BERANDA -->
  <main class="max-w-6xl mx-auto p-4 space-y-4">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 text-center">
      <h2 class="text-base font-bold text-emerald-900 mb-1">Etalase Produk UMKM Nusantara</h2>
      <p class="text-xs text-gray-500">Temukan produk unggulan dan kerajinan pilihan dari mitra terpercaya kami.</p>
    </div>

    <!-- DAFTAR PRODUK ETALASE -->
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5">
      <p class="col-span-full text-center text-xs text-gray-400 py-8">Memuat etalase produk...</p>
    </div>
  </main>

  <!-- NAVBAR BAWAH -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 px-3 flex justify-around items-center z-50 shadow-lg">
    <a href="index.html" class="flex flex-col items-center text-emerald-800 font-bold">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px] mt-1">Beranda</span>
    </a>
    <a href="admin.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-800">
      <i class="fa-solid fa-lock text-base"></i>
      <span class="text-[10px] mt-1">Admin</span>
    </a>
  </nav>

  <!-- SCRIPT SUPABASE & KERANJANG -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://iegqvegvoqjqjjyucpss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7o0SP7VYOFhYJ0qyDrPtzw_2VvkuiMy';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cartCount = 0;

    async function fetchProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .or('status.eq.approved,status.eq.disetujui');

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = `<p class="col-span-full text-center text-xs text-gray-400 py-8">Belum ada produk aktif yang disetujui.</p>`;
          return;
        }

        grid.innerHTML = data.map(item => {
          const title = item.title || item.name || 'Produk UMKM';
          const price = item.price ? Number(item.price).toLocaleString('id-ID') : '0';
          const category = item.category || 'Pakaian';
          
          // Memastikan mengambil gambar asli dari database (image_url atau image)
          const img = item.image_url || item.image || item.foto || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80';
          
          const wa = item.phone_number || item.whatsapp || '6281241170648';
          const waLink = `https://wa.me/${wa}?text=` + encodeURIComponent(`Halo Kak, saya ingin memesan produk ${title} seharga Rp ${price} di Borneoku.`);

          return `
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
              <div>
                <div class="h-36 bg-gray-100 overflow-hidden relative">
                  <img src="${img}" alt="${title}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80'">
                  <span class="absolute top-2 left-2 bg-emerald-900/80 text-amber-300 text-[8.5px] font-bold px-1.5 py-0.5 rounded-md">${category}</span>
                </div>
                <div class="p-2 space-y-0.5">
                  <h4 class="font-bold text-xs text-gray-900 line-clamp-1">${title}</h4>
                  <p class="text-xs text-emerald-800 font-extrabold">Rp ${price}</p>
                </div>
              </div>
              <div class="p-2 pt-0 grid grid-cols-2 gap-1">
                <button onclick="addToCart('${title}')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-1.5 rounded-lg text-[9.5px] transition shadow-sm active:scale-95">
                  + Keranjang
                </button>
                <a href="${waLink}" target="_blank" class="bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-1.5 rounded-lg text-[9.5px] transition text-center flex items-center justify-center gap-0.5 shadow-sm">
                  <i class="fa-brands fa-whatsapp text-[10px]"></i> Pesan
                </a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = `<p class="col-span-full text-center text-xs text-red-500 py-6">Gagal memuat etalase.</p>`;
      }
    }

    function addToCart(productTitle) {
      cartCount++;
      document.getElementById('cart-count').innerText = cartCount;
    }

    function viewCart() {
      alert(`Keranjang Belanja Anda saat ini berisi ${cartCount} item.`);
    }

    fetchProducts();
  </script>
</body>
</html>
