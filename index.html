<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borneoku - Karya Nusantara, Pasar Dunia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-borneo-dark { background-color: #064e3b; }
    body { background-color: #f8fafc; padding-bottom: 90px; }
  </style>
</head>
<body class="font-sans text-gray-800">

  <!-- HEADER UTAMA -->
  <header class="bg-borneo-dark text-white p-3 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <!-- LOGO ASLI BORNEOKU -->
        <div class="w-10 h-10 rounded-full bg-white shadow-md shrink-0 flex items-center justify-center overflow-hidden border border-amber-400 p-0.5">
          <img src="1000386730.png" alt="Logo Borneoku" class="w-full h-full object-cover rounded-full">
        </div>
        <div>
          <h1 class="font-extrabold text-sm tracking-wide text-amber-300">Borneoku</h1>
          <p class="text-[9px] text-amber-100 font-medium">Karya Nusantara, Pasar Dunia</p>
        </div>
      </div>
      <a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow flex items-center gap-1">
        <i class="fa-solid fa-lock text-[10px]"></i> Admin
      </a>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="max-w-6xl mx-auto p-4 space-y-4">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 text-center">
      <h2 class="text-base font-bold text-emerald-900 mb-1">Etalase Produk UMKM Nusantara</h2>
      <p class="text-xs text-gray-500">Temukan produk unggulan dan kerajinan pilihan dari mitra terpercaya kami.</p>
    </div>

    <!-- DAFTAR PRODUK -->
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <p class="col-span-full text-center text-xs text-gray-400 py-8">Memuat etalase produk...</p>
    </div>
  </main>

  <!-- NAVBAR BAWAH -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 px-3 flex justify-around items-center z-50 shadow-lg">
    <a href="index.html" class="flex flex-col items-center text-emerald-800 font-bold">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px] mt-1">Beranda</span>
    </a>
    <a href="admin.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-800">
      <i class="fa-solid fa-lock text-base"></i>
      <span class="text-[10px] mt-1">Admin</span>
    </a>
  </nav>

  <!-- SCRIPT SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://iegqvegvoqjqjjyucpss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7o0SP7VYOFhYJ0qyDrPtzw_2VvkuiMy';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .or('status.eq.approved,status.eq.disetujui');

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = `<p class="col-span-full text-center text-xs text-gray-400 py-8">Belum ada produk aktif. Silakan buka menu <b>Admin</b> di atas untuk menyetujui produk.</p>`;
          return;
        }

        grid.innerHTML = data.map(item => {
          const title = item.title || item.name || 'Produk UMKM';
          const price = item.price ? Number(item.price).toLocaleString('id-ID') : '0';
          const category = item.category || 'Pakaian';
          const img = item.image_url || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80';
          const wa = item.phone_number || item.whatsapp || '6281241170648';
          const waLink = `https://wa.me/${wa}?text=` + encodeURIComponent(`Halo Kak, saya ingin memesan produk ${title} seharga Rp ${price} di Borneoku.`);

          return `
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
              <div>
                <div class="h-36 bg-gray-100 overflow-hidden relative">
                  <img src="${img}" alt="${title}" class="w-full h-full object-cover">
                  <span class="absolute top-2 left-2 bg-emerald-900/80 text-amber-300 text-[9px] font-bold px-2 py-0.5 rounded-md">${category}</span>
                </div>
                <div class="p-2.5 space-y-1">
                  <h4 class="font-bold text-xs text-gray-900 line-clamp-1">${title}</h4>
                  <p class="text-xs text-emerald-800 font-extrabold">Rp ${price}</p>
                </div>
              </div>
              <div class="p-2.5 pt-0">
                <a href="${waLink}" target="_blank" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-2 rounded-lg text-[10px] transition text-center flex items-center justify-center gap-1.5 shadow-sm block">
                  <i class="fa-brands fa-whatsapp text-xs"></i> Pesan WhatsApp
                </a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = `<p class="col-span-full text-center text-xs text-red-500 py-6">Gagal memuat etalase.</p>`;
      }
    }

    fetchProducts();
  </script>
</body>
        </html>
