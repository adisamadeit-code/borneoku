<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Layanan Mitra Borneoku</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-borneo-dark { background-color: #064e3b; }
    body { background-color: #f8fafc; padding-bottom: 120px; }
  </style>
</head>
<body class="font-sans text-gray-800">

  <!-- HEADER ADMIN -->
  <header class="bg-borneo-dark text-white p-3 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-store text-amber-300 text-base"></i>
        <h1 class="font-bold text-xs sm:text-sm">Pusat Layanan Mitra <span class="text-amber-300">Borneoku</span></h1>
      </div>
      <!-- Tombol Kembali ke Beranda (Murni HTML, dijamin tidak nyangkut) -->
      <a href="index.html" class="bg-emerald-800 hover:bg-emerald-900 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold border border-emerald-600 shadow-sm flex items-center gap-1.5">
        <i class="fa-solid fa-house text-xs"></i> Ke Beranda
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <!-- PANEL VERIFIKASI ADMIN -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <div>
          <h2 class="font-extrabold text-gray-900 text-sm flex items-center gap-2">
            <i class="fa-solid fa-lock text-emerald-800"></i> Panel Verifikasi Admin Borneoku
          </h2>
          <p class="text-[11px] text-gray-500 mt-0.5">Daftar produk masuk yang menunggu persetujuan admin:</p>
        </div>
        <button onclick="loadAdminProducts()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-lg text-xs font-bold">
          <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
        </button>
      </div>

      <div id="admin-product-list" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-6">Memuat daftar produk...</p>
      </div>
    </div>
  </main>

  <!-- NAVBAR BAWAH (Murni Link Standar) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 px-3 flex justify-around items-center z-50 shadow-lg">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-800">
      <i class="fa-solid fa-house text-sm"></i>
      <span class="text-[9px] font-medium mt-1">Beranda</span>
    </a>
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-800">
      <i class="fa-solid fa-boxes-stacked text-sm"></i>
      <span class="text-[9px] font-medium mt-1">Tambah Produk</span>
    </a>
    <a href="admin.html" class="flex flex-col items-center text-emerald-800 font-bold">
      <i class="fa-solid fa-lock text-sm"></i>
      <span class="text-[9px] mt-1">Pengaturan Admin</span>
    </a>
  </nav>

  <!-- SCRIPT SUPABASE VIA CDN RESMI -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://iegqvegvoqjqjjyucpss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7o0SP7VYOFhYJ0qyDrPtzw_2VvkuiMy';
    
    let supabaseClient;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("Gagal inisialisasi Supabase:", e);
    }

    async function loadAdminProducts() {
      const container = document.getElementById('admin-product-list');
      container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat daftar produk...</p>`;
      
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">Tidak ada produk ditemukan di database.</p>`;
          return;
        }

        container.innerHTML = data.map(item => {
          const title = item.title || item.name || 'Produk Tanpa Nama';
          const price = item.price ? Number(item.price).toLocaleString('id-ID') : '0';
          const wa = item.phone_number || item.whatsapp || '-';
          const address = item.address || '-';
          const status = item.status || 'pending';
          const img = item.image_url || '1000387731.png';

          const isApproved = (status === 'approved' || status === 'disetujui');

          const actionButton = isApproved 
            ? `<button onclick="toggleProductStatus('${item.id}', 'pending')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm active:scale-95 transition flex items-center gap-1 border border-gray-300">
                <i class="fa-solid fa-rotate-left text-amber-600"></i> Batal Setuju
               </button>`
            : `<button onclick="toggleProductStatus('${item.id}', 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm active:scale-95 transition flex items-center gap-1">
                <i class="fa-solid fa-check"></i> Setuju
               </button>`;

          const statusBadge = isApproved 
            ? `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">Approved</span>`
            : `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">Pending</span>`;

          return `
            <div class="p-3 border border-gray-200 rounded-xl flex items-center justify-between gap-3 bg-white shadow-sm">
              <div class="flex items-center gap-3 min-w-0">
                <img src="${img}" alt="${title}" class="w-12 h-12 rounded-lg object-cover bg-gray-100 shrink-0" onerror="this.src='https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=100&q=80'">
                <div class="min-w-0">
                  <h4 class="font-bold text-xs text-gray-900 truncate">${title}</h4>
                  <p class="text-[11px] text-gray-600 font-medium">Rp ${price} | WA: ${wa}</p>
                  <p class="text-[10px] text-gray-400 truncate">Alamat: ${address}</p>
                  <div class="mt-1">${statusBadge}</div>
                </div>
              </div>
              <div class="flex gap-1.5 shrink-0">
                ${actionButton}
                <button onclick="deleteProduct('${item.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm active:scale-95 transition flex items-center gap-1">
                  <i class="fa-solid fa-trash"></i> Hapus
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="text-center text-xs text-red-500 py-6">Gagal memuat produk: ${err.message}</p>`;
      }
    }

    // Fungsi Update Status (Hanya mengubah data tanpa memaksa pindah halaman otomatis agar tidak macet)
    window.toggleProductStatus = async function(id, newStatus) {
      try {
        const { error } = await supabaseClient
          .from('products')
          .update({ status: newStatus, is_available: (newStatus === 'approved') })
          .eq('id', id);

        if (error) throw error;

        // Muat ulang daftar produk agar tombol berubah jadi 'Batal Setuju' dengan mulus
        loadAdminProducts();
      } catch (err) {
        alert('❌ Gagal mengubah status produk: ' + err.message);
      }
    };

    // Fungsi Tombol Hapus
    window.deleteProduct = async function(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus produk ini?')) return;
      try {
        const { error } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);

        if (error) throw error;
        loadAdminProducts();
      } catch (err) {
        alert('❌ Gagal menghapus produk: ' + err.message);
      }
    };

    document.addEventListener('DOMContentLoaded', loadAdminProducts);
  </script>
</body>
</html>
