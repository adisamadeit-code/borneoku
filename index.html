<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorneoKu - Marketplace UMKM Kalimantan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-emerald-700 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-store text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">BorneoKu</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openSellerModal()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs md:text-sm font-semibold px-3 py-1.5 rounded-lg transition shadow">
                    <i class="fa-solid fa-user-plus mr-1"></i> Daftar Mitra UMKM
                </button>
                <button onclick="toggleCartModal()" class="bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded-lg flex items-center space-x-2 text-sm font-medium transition">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Keranjang</span>
                    <span id="cart-count" class="bg-amber-400 text-emerald-950 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Banner Utama -->
    <section class="bg-emerald-800 text-white py-10 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-bold mb-2">Marketplace Produk Unggulan BorneoKu</h2>
            <p class="text-emerald-100 text-sm md:text-base">Dukung produk lokal berkualitas tinggi langsung dari para pengrajin dan UMKM terbaik se-Kalimantan.</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h3 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">Produk Terbaru</h3>
        <div id="product-list" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Loading State -->
            <div class="col-span-full text-center py-10 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Memuat produk UMKM...</p>
            </div>
        </div>
    </main>

    <!-- Modal Pendaftaran Mitra UMKM -->
    <div id="seller-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeSellerModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            <h3 class="text-lg font-bold text-emerald-800 mb-1"><i class="fa-solid fa-shop mr-2"></i>Daftar Jadi Mitra UMKM</h3>
            <p class="text-xs text-gray-500 mb-4">Bergabunglah dengan BorneoKu dan pasarkan produk unggulan Anda ke seluruh Indonesia.</p>
            
            <form id="seller-form" onsubmit="submitSellerRegistration(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Toko / Usaha</label>
                    <input type="text" id="store_name" required placeholder="Contoh: Rumah Jahit Adisa" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Pemilik Usaha</label>
                    <input type="text" id="owner_name" required placeholder="Nama Lengkap Anda" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor WhatsApp Aktif</label>
                    <input type="tel" id="seller_whatsapp" required placeholder="08123456789" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Kota / Kabupaten (Kalimantan)</label>
                    <input type="text" id="seller_city" required placeholder="Contoh: Nunukan, Tarakan, Samarinda" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori Utama Produk</label>
                    <select id="seller_category" required class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Kerajinan & Seni">Kerajinan & Seni</option>
                        <option value="Busana & Fesyen">Busana & Fesyen</option>
                        <option value="Makanan & Minuman Herbal">Makanan & Minuman Herbal</option>
                        <option value="Kuliner Khas">Kuliner Khas</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <button type="submit" id="btn-submit-seller" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow mt-4">
                    Kirim Pendaftaran
                </button>
            </form>
        </div>
    </div>

    <!-- Script Koneksi Supabase & Logika -->
    <script>
        const SUPABASE_URL = 'https://syqhyqffvxpxzhyxptwq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5cWh5cWZmdnhweHpoeXhwdHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMTcwNTUsImV4cCI6MjA1Njc5MzA1NX0.S_1Uf19J3oM4r2tQ1o7B80u2S4xR2jN8P8Y8Z8Z8Z8Z'; // Diselaraskan dengan skrip utama
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function openSellerModal() {
            document.getElementById('seller-modal').classList.remove('hidden');
        }

        function closeSellerModal() {
            document.getElementById('seller-modal').classList.add('hidden');
        }

        async function submitSellerRegistration(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-submit-seller');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Mengirim...';

            const store_name = document.getElementById('store_name').value;
            const owner_name = document.getElementById('owner_name').value;
            const whatsapp = document.getElementById('seller_whatsapp').value;
            const city = document.getElementById('seller_city').value;
            const category = document.getElementById('seller_category').value;

            try {
                const { data, error } = await supabase
                    .from('sellers')
                    .insert([{ store_name, owner_name, whatsapp, city, category }]);

                if (error) throw error;

                alert('Pendaftaran Berhasil! Tim BorneoKu akan menghubungi Anda melalui WhatsApp untuk verifikasi toko.');
                document.getElementById('seller-form').reset();
                closeSellerModal();
            } catch (err) {
                alert('Terjadi kesalahan saat pendaftaran. Silakan coba lagi.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Kirim Pendaftaran';
            }
        }
    </script>
</body>
</html>
