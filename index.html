<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borneoku - Karya Nusantara, Pasar Dunia</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #f4f5f7; padding-bottom: 80px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="font-sans text-gray-800">

  <!-- HEADER UTAMA PEMBELI -->
  <header class="bg-emerald-900 text-white p-3.5 sticky top-0 z-40 flex justify-between items-center shadow">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-amber-400 text-emerald-950 font-bold flex items-center justify-center text-xs shadow">
        B
      </div>
      <div>
        <h1 class="font-extrabold text-xs tracking-wide">BORNEOKU</h1>
        <p class="text-[8.5px] text-emerald-200">Karya Nusantara, Pasar Dunia</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-emerald-950 font-extrabold text-[10px] px-3 py-1.5 rounded-xl shadow flex items-center gap-1">
        <i class="fa-solid fa-gauge"></i> Seller Center
      </a>
    </div>
  </header>

  <!-- KONTEN UTAMA ETALASE -->
  <main class="max-w-2xl mx-auto p-3.5 space-y-3">
    <!-- BANNER UTAMA -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-2">
      <h2 class="font-bold text-sm text-gray-900">Satu Marketplace, <span class="text-emerald-800">Berjuta Produk Unggulan</span> Indonesia</h2>
      <p class="text-[11px] text-gray-500 leading-relaxed">Dukung UMKM & Pengrajin lokal Nusantara. Temukan berbagai kerajinan dan produk pilihan.</p>
    </div>

    <!-- DAFTAR PRODUK DARI DATABASE -->
    <div class="space-y-2">
      <h3 class="font-bold text-xs text-gray-900 px-1">Etalase Produk UMKM Nusantara</h3>
      <div id="product-grid" class="grid grid-cols-2 gap-3">
        <p class="text-xs text-gray-400 col-span-2 text-center py-6">Memuat produk...</p>
      </div>
    </div>
  </main>

  <!-- NAVBAR BAWAH PEMBELI -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-1.5 px-1 flex justify-around items-center z-50 text-[9.5px]">
    <a href="index.html" class="flex flex-col items-center text-emerald-800 font-bold">
      <i class="fa-solid fa-house text-base"></i>
      <span class="mt-0.5">Beranda</span>
    </a>
    <a href="admin.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-800">
      <i class="fa-solid fa-bag-shopping text-base"></i>
      <span class="mt-0.5">Seller Center</span>
    </a>
  </nav>

  <!-- SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://iegqvegvoqjqjjyucpss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7o0SP7VYOFhYJ0qyDrPtzw_2VvkuiMy';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadBuyerProducts() {
      const container = document.getElementById('product-grid');
      try {
        const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
        if (error) throw error;
        const list = data || [];
        if (list.length === 0) {
          container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6 col-span-2">Belum ada produk tersedia di etalase.</p>`;
          return;
        }
        container.innerHTML = list.map(item => `
          <div class="bg-white p-3 rounded-2xl border shadow-sm space-y-2 flex flex-col justify-between">
            <div>
              <img src="${item.image_url || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80'}" class="w-full h-32 rounded-xl object-cover border">
              <span class="inline-block mt-2 bg-emerald-100 text-emerald-800 text-[8px] font-bold px-1.5 py-0.5 rounded">${item.category || 'Umum'}</span>
              <h4 class="font-bold text-xs text-gray-900 truncate mt-1">${item.title}</h4>
              <p class="text-[11px] text-emerald-800 font-extrabold mt-0.5">Rp ${Number(item.price).toLocaleString('id-ID')}</p>
            </div>
            <a href="https://wa.me/628123456789?text=Halo,%20saya%20tertarik%20dengan%20produk%20${encodeURIComponent(item.title)}" target="_blank" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-1.5 rounded-xl text-[10px] text-center shadow">
              <i class="fa-brands fa-whatsapp"></i> Pesan
            </a>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-center text-xs text-red-500 col-span-2">Gagal memuat etalase: ${err.message}</p>`;
      }
    }

    loadBuyerProducts();
  </script>
</body>
</html>
