<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-borneo-dark { background-color: #064e3b; }
        .text-gold { color: #d4af37; }
        body { background-color: #f8fafc; padding-bottom: 80px; }
    </style>
</head>
<body class="font-sans text-gray-800">

    <!-- HEADER UTAMA -->
    <header class="bg-borneo-dark text-white p-3 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <!-- LOGO ASLI -->
                <div class="w-10 h-10 rounded-full bg-amber-300 flex items-center justify-center overflow-hidden border border-amber-400">

                </div>
                <div>
                    <h1 class="font-extrabold text-sm tracking-wide text-amber-300">Borneoku</h1>
                    <p class="text-[9px] text-amber-100 font-medium">Karya Nusantara, Pasar Dunia</p>
                </div>
            </div>
            <a href="admin.html" class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg font-semibold shadow flex items-center">
                <i class="fa-solid fa-lock text-[10px] mr-1.5"></i> Admin
            </a>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-6xl mx-auto p-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 text-center mb-5">
            <h2 class="text-base font-bold text-emerald-900 mb-1">Etalase UMKM Nusantara</h2>
            <p class="text-xs text-gray-500">Temukan produk unggulan dari mitra terpercaya kami.</p>
        </div>

        <!-- DAFTAR PRODUK (ETALASE) -->
        <div id="product-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- KARTU PRODUK BAJU BATIK DENGAN GAMBAR ASLI -->
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="w-full h-36 bg-gray-100 rounded-lg mb-2 overflow-hidden">
                        <img src="1000387731.png" alt="Baju batik seragam korpri" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-semibold text-xs text-gray-800 line-clamp-2">Baju batik seragam korpri</h3>
                    <p class="text-emerald-700 font-bold text-xs mt-1">Rp 350.000</p>
                </div>
                <span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded mt-2 inline-block text-center font-medium">Tersedia</span>
            </div>
        </div>
    </main>

    <!-- NAVBAR BAWAH -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around items-center text-center">
            <a href="index.html" class="text-emerald-700 flex flex-col items-center">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px] mt-0.5 font-semibold">Beranda</span>
            </a>
            <a href="admin.html" class="text-gray-400 hover:text-emerald-700 flex flex-col items-center">
                <i class="fa-solid fa-lock text-base"></i>
                <span class="text-[10px] mt-0.5">Admin</span>
            </a>
        </div>
    </nav>

    <!-- SCRIPT SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        console.log("BorneoKu Etalase Siap");
