<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BorneoKu - Marketplace UMKM Indonesia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20">
  <header class="bg-emerald-700 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-store text-2xl text-amber-300"></i>
        <h1 class="text-xl font-bold tracking-wide">BorneoKu</h1>
      </div>
      <button onclick="toggleCart()" class="relative bg-emerald-800 px-3 py-2 rounded-lg text-sm flex items-center gap-2 hover:bg-emerald-900 transition">
        <i class="fa-solid fa-cart-shopping text-lg text-amber-300"></i>
        <span>Keranjang</span>
        <span id="cart-count" class="bg-amber-400 text-emerald-950 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>
  <section class="bg-emerald-800 text-white py-8 px-4 text-center">
    <div class="max-w-3xl mx-auto">
      <h2 class="text-2xl md:text-3xl font-extrabold mb-2">Produk Unggulan UMKM Kalimantan & Indonesia</h2>
      <p class="text-emerald-100 text-sm">Belanja produk lokal berkualitas, cepat, aman, dan langsung dari pengrajin.</p>
    </div>
  </section>
  <main class="max-w-6xl mx-auto px-4 py-6">
    <h3 class="text-lg font-bold mb-4 border-l-4 border-emerald-600 pl-3">Katalog Produk</h3>
    <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Produk Sample" class="w-full h-40 object-cover">
        <div class="p-3 flex-1 flex flex-col justify-between">
          <div>
            <span class="bg-emerald-100 text-emerald-800 text-[10px] font-semibold px-2 py-0.5 rounded">Kerajinan</span>
            <h4 class="font-bold text-sm mt-1 line-clamp-2">Souvenir Khas Borneo</h4>
            <p class="text-emerald-700 font-bold text-sm mt-1">Rp 75.000</p>
          </div>
          <button onclick="addToCart('Souvenir Khas Borneo', 75000)" class="mt-3 w-full bg-emerald-600 text-white text-xs py-2 rounded-lg font-medium hover:bg-emerald-700 transition">
            + Keranjang
          </button>
        </div>
      </div>
    </div>
  </main>
  <script>
    let cart = [];
    function toggleCart() {}
    function addToCart(title, price) {
      cart.push({ title, price });
      alert(title + " ditambahkan!");
    }
  </script>
</body>
</html>
